version: "2011-06-01"
last_amended: "2022-09-01"
category: "general"
source: "G.S.R. 368(E)"

rules:
  - id: "LM-PC-R6-1"
    field: "manufacturer_name"
    description: "Name of manufacturer/packer/importer must be declared (Rule 6)"
    rule_type: "presence"
    mandatory: true
    applies_to:
      - "*"
    exemptions: []
    penalty_class: "A"
    added_date: "2011-06-01"
    superseded_date: null

  - id: "LM-PC-R6-2"
    field: "manufacturer_address"
    description: "Address of manufacturer/packer/importer must be declared (Rule 6)"
    rule_type: "presence"
    mandatory: true
    applies_to:
      - "*"
    exemptions: []
    penalty_class: "A"
    added_date: "2011-06-01"
    superseded_date: null

  - id: "LM-PC-R9-0"
    field: "mrp"
    description: "MRP declaration must be present on every package (Rule 9)"
    rule_type: "presence"
    mandatory: true
    applies_to:
      - "*"
    exemptions: []
    penalty_class: "A"
    added_date: "2011-06-01"
    superseded_date: null

  - id: "LM-PC-R8-1"
    field: "net_quantity"
    description: "Net quantity must use standard SI units (Rule 8)"
    rule_type: "value"
    mandatory: true
    allowed_units:
      - "g"
      - "kg"
      - "ml"
      - "l"
      - "cm"
      - "m"
      - "number"
      - "nos"
    applies_to:
      - "*"
    exemptions: []
    penalty_class: "A"
    added_date: "2011-06-01"
    superseded_date: null

  - id: "LM-PC-R7-1"
    field: "*"
    description: "All declarations must have minimum font size of 1mm height (~2.8pt) (Rule 7)"
    rule_type: "font_size"
    mandatory: true
    min_font_size_pt: 2.8
    applies_to:
      - "*"
    exemptions: []
    penalty_class: "B"
    added_date: "2011-06-01"
    superseded_date: null

  - id: "LM-PC-R11-1"
    field: "manufacture_date"
    description: "Month and year of manufacture/packing must be declared (Rule 11)"
    rule_type: "presence"
    mandatory: true
    applies_to:
      - "*"
    exemptions: []
    penalty_class: "A"
    added_date: "2011-06-01"
    superseded_date: null

  - id: "LM-PC-R6-3"
    field: "consumer_care"
    description: "Consumer care details must be provided (Rule 6 Amendment 2017)"
    rule_type: "presence"
    mandatory: true
    applies_to:
      - "*"
    exemptions: []
    penalty_class: "B"
    added_date: "2017-01-01"
    superseded_date: null

  - id: "LM-PC-R6-4"
    field: "net_quantity"
    description: "Net quantity declaration must be present on every package (Rule 6)"
    rule_type: "presence"
    mandatory: true
    applies_to:
      - "*"
    exemptions:
      - condition: "net_weight_g < 10"
    penalty_class: "A"
    added_date: "2011-06-01"
    superseded_date: null