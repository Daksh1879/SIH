<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Result — LabelSetu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob-field">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>
<div class="noise-overlay"></div>

<nav class="navbar">
  <div class="brand">LabelSetu<sup>®</sup></div>
  <div class="nav-links">
    <a href="upload.html">Check label</a>
    <a href="dashboard.html">Dashboard</a>
    <button class="theme-toggle" id="themeToggleBtn">🌙 Dark</button>
    <button class="theme-toggle" id="logoutBtn">Log out</button>
  </div>
</nav>

<div class="page">
  <div class="container">
    <p class="eyebrow">Scan result</p>
    <div class="card" id="resultCard">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  async function initResults() {
    await requireAuth();

    const params = new URLSearchParams(window.location.search);
    const scanId = params.get('id');
    const card   = document.getElementById('resultCard');

    if (!scanId) {
      card.innerHTML = '<div class="empty-state">No scan ID provided. <a href="upload.html">Try a new upload</a>.</div>';
      return;
    }

    const scan = await getScanById(scanId);

    if (!scan) {
      card.innerHTML = '<div class="empty-state">Scan not found. <a href="upload.html">Try a new upload</a>.</div>';
      return;
    }

    const missingCount = scan.missingFields ? scan.missingFields.length : 0;
    const badgeClass   = scan.status === 'pass' ? 'pass' : 'fail';
    const badgeText    = scan.status === 'pass'
      ? 'All fields present'
      : missingCount + ' field' + (missingCount !== 1 ? 's' : '') + ' missing';

    const foundRows = (scan.foundFields || []).map(field => `
      <div class="field-row">
        <span>${field}</span>
        <span class="value pass">✓ Detected</span>
      </div>
    `).join('');

    const missingRows = (scan.missingFields || []).map(field => `
      <div class="field-row">
        <span>${field}</span>
        <span class="value fail">✕ Missing</span>
      </div>
    `).join('');

    const extractedSection = scan.extractedText
      ? `<details style="margin-top:16px;font-size:13px;color:#555;">
           <summary style="cursor:pointer;font-weight:600;">Extracted text</summary>
           <pre style="white-space:pre-wrap;margin-top:8px;">${scan.extractedText}</pre>
         </details>`
      : '';

    card.innerHTML = `
      <div class="result-header">
        <h2>Scan result</h2>
        <span class="status-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="result-meta">
        <div class="meta-text">
          Category: <strong>${scan.category}</strong><br>
          Checked: ${new Date(scan.createdAt).toLocaleString()}
        </div>
      </div>
      <div>${foundRows}${missingRows}</div>
      ${extractedSection}
      <button class="primary" style="margin-top:22px;" onclick="window.print()">Download report</button>
      <button class="secondary" onclick="window.location.href='upload.html'">Check another label</button>
    `;
  }

  initResults();
</script>
</body>
</html>
