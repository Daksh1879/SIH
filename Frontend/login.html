<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — LabelSetu</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: #f5f6fa !important; color: #333333 !important; }
    body { min-height: 100vh; }
    .page { background: #f5f6fa !important; }
    .card { background: #ffffff !important; color: #333333 !important; }
    h1 { color: #1a237e !important; }
    .subtitle { color: #555555 !important; }
    label { color: #555555 !important; }
    input { background: #ffffff !important; color: #333333 !important; }
    input::placeholder { color: #888888 !important; }
    .form-footer { color: #555555 !important; }
    .form-footer a { color: #1a237e !important; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">LabelSetu<sup>®</sup></div>
  </nav>

  <div class="page">
    <div class="container">
      <p class="eyebrow">Label compliance, made visible</p>
      <div class="card">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to continue checking labels.</p>
        <form id="loginForm">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@example.com" required>
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required>
          <p class="error-text" id="errorText" style="display: none;"></p>
          <button type="submit" class="primary">Log in</button>
        </form>
        <p class="form-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('errorText');
      const btn      = this.querySelector('button[type="submit"]');

      errorEl.style.display = 'none';
      btn.disabled    = true;
      btn.textContent = 'Logging in…';

      const result = await mockLogin(email, password);

      if (!result.ok) {
        errorEl.textContent   = result.error;
        errorEl.style.display = 'block';
        btn.disabled    = false;
        btn.textContent = 'Log in';
        return;
      }
      window.location.href = 'upload.html';
    });
  </script>
</body>
</html>
